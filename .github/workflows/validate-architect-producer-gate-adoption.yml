name: validate-architect-producer-gate-adoption

on:
  pull_request:
    paths:
      - 'README.md'
      - 'STATUS.md'
      - 'status-history/**'
      - 'contracts/project-gate/**'
      - 'manifests/**'
      - 'schemas/ev4-architect-pipeline-manifest.v1.schema.json'
      - 'fixtures/build-tree/**'
      - 'fixtures/project-gate-export/**'
      - 'fixtures/architect-project-gate-export/**'
      - 'references/ELEMENTOR_V4_OFFICIAL_CAPABILITY_REGISTRY.v1.json'
      - 'docs/BEHAVIORAL_RULE_COVERAGE_PROMPT_01.md'
      - 'docs/PROJECT_GATE_PRODUCER_ADOPTION.md'
      - 'docs/ARCHITECT_PROJECT_GATE_EXPORTER.md'
      - 'docs/ARCHITECT_PROJECT_GATE_EXPORTER_ARCH02.md'
      - 'EV4_ARCHITECT_EXPORT_PYTHON_v2/**'
      - 'scripts/check-architect-producer-gate-adoption.py'
      - 'scripts/architect_runtime_payload_authority.py'
      - 'scripts/architect_runtime_payload_assembler/**'
      - 'scripts/architect_project_gate_exporter/**'
      - 'tests/test_architect_producer_gate_adoption.py'
      - 'tests/test_architect_project_gate_exporter*.py'
      - 'tests/test_architect_handoff_classification.py'
      - 'tests/test_architect_handoff_validator_consistency.py'
      - '.github/workflows/validate-architect-producer-gate-adoption.yml'
      - '.github/workflows/validate-architect-producer-gate-adoption-main.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact pull request head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'jsonschema>=4.22.0' 'pytest>=8.0.0'
      - name: Compile Runtime-owned exporter boundary
        run: |
          python -m py_compile \
            scripts/architect_runtime_payload_authority.py \
            scripts/architect_runtime_payload_assembler/__init__.py \
            scripts/architect_project_gate_exporter/__init__.py \
            scripts/architect_project_gate_exporter/contracts.py \
            scripts/architect_project_gate_exporter/eligibility.py
      - name: Remove generated bytecode before live-checkout tests
        shell: bash
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Run Architect Stage Payload regression validator
        run: python scripts/check-architect-stage-payload.py
      - name: Run Architect Producer adoption validator
        run: python scripts/check-architect-producer-gate-adoption.py --format json
      - name: Run Architect Producer adoption tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider -q tests/test_architect_producer_gate_adoption.py
      - name: Remove generated bytecode before Runtime-owned tests
        shell: bash
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Run Runtime-owned Project Gate tests
        id: exporter-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            pytest -p no:cacheprovider -q \
              tests/test_architect_project_gate_exporter.py \
              tests/test_architect_handoff_classification.py \
              tests/test_architect_handoff_validator_consistency.py \
            2>&1 | tee "${{ runner.temp }}/architect-exporter-pytest.log"
      - name: Upload exporter failure diagnostics
        if: steps.exporter-tests.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: architect-exporter-pytest-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/architect-exporter-pytest.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce exporter test result
        if: steps.exporter-tests.outcome != 'success'
        run: |
          cat "${{ runner.temp }}/architect-exporter-pytest.log"
          exit 1
