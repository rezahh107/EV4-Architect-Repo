name: verify-project-gate-contract

# Active PCVP-compatible Project Gate common-contract caller.
on:
  pull_request:
    paths:
      - 'contracts/project-gate/**'
      - '.github/workflows/verify-project-gate-contract.yml'

permissions:
  contents: read

jobs:
