    uses: rezahh107/EV4-Project-Gate/.github/workflows/verify-vendored-common-contract.yml@a8c743a7441dc8a06c3aa23310eed99076fc97d6
    with:
      lock_path: contracts/project-gate/producer-gate-export.v1.lock.json
