name: Validate PCVP active Architect producer

on:
  pull_request:
    paths:
      - "contracts/pcvp/**"
      - "contracts/project-gate/producer-gate-export.v1.schema.json"
      - "contracts/project-gate/producer-gate-export.v1.lock.json"
      - "manifests/architect-runtime-authority-manifest.v1.json"
      - "scripts/architect_pcvp_producer.py"
      - "scripts/architect_project_gate_exporter/contracts.py"
      - "scripts/architect_runtime_payload_authority.py"
      - "scripts/validate-pcvp-canonical-bytes.py"
      - "tests/test_architect_pcvp_dormant_producer.py"
      - "tests/test_pcvp_canonical_bytes.py"
      - "tests/test_architect_project_gate_exporter.py"
      - "tests/test_architect_project_gate_finalization_api.py"
      - ".github/workflows/validate-pcvp-dormant-producer.yml"
      - "STATUS.md"

permissions:
  contents: read

jobs:
  validate:
    name: Exact-head Runtime authority and canonical PCVP activation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Architect pull request head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact Architect pull request head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Assert clean Architect checkout
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Checkout immutable Decision Kernel bundle snapshot
        shell: bash
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-dependencies/decision-kernel-bundle
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          checkout_exact() {
            local target="$1"; local repository="$2"; local expected_sha="$3"
            mkdir -p "$(dirname "$target")"
            git init -q "$target"
            git -C "$target" remote add origin "$repository"
            git -C "$target" -c protocol.version=2 fetch --depth=1 --no-tags origin "$expected_sha"
            git -C "$target" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$target" rev-parse HEAD)" = "$expected_sha"
            test -z "$(git -C "$target" status --porcelain=v1 --untracked-files=all)"
            git -C "$target" remote remove origin
          }
          checkout_exact "$EV4_DECISION_KERNEL_CHECKOUT" "https://github.com/rezahh107/EV4-Decision-Kernel.git" "069a50fa243b01fa578a7c1bcb8864d9e796d34b"

      - name: Checkout exact Decision Kernel activation authority
        shell: bash
        env:
          EV4_DECISION_KERNEL_ACTIVATION_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-dependencies/decision-kernel-activation
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          checkout_exact() {
            local target="$1"; local repository="$2"; local expected_sha="$3"
            mkdir -p "$(dirname "$target")"
            git init -q "$target"
            git -C "$target" remote add origin "$repository"
            git -C "$target" -c protocol.version=2 fetch --depth=1 --no-tags origin "$expected_sha"
            git -C "$target" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$target" rev-parse HEAD)" = "$expected_sha"
            test -z "$(git -C "$target" status --porcelain=v1 --untracked-files=all)"
            git -C "$target" remote remove origin
          }
          checkout_exact "$EV4_DECISION_KERNEL_ACTIVATION_CHECKOUT" "https://github.com/rezahh107/EV4-Decision-Kernel.git" "ad0e7235929d7f6d847724f6b4d1a6a3c57453db"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install "jsonschema>=4.22.0" "pytest>=8.0.0" "PyYAML>=6.0.0"

      - name: Compile active authority surfaces
        run: >-
          python -m py_compile
          scripts/architect_pcvp_producer.py
          scripts/architect_project_gate_exporter/contracts.py
          scripts/validate-pcvp-canonical-bytes.py
          tests/test_architect_pcvp_dormant_producer.py
          tests/test_pcvp_canonical_bytes.py

      - name: Validate immutable canonical PCVP bytes
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-dependencies/decision-kernel-bundle
        run: python scripts/validate-pcvp-canonical-bytes.py

      - name: Validate active lock and canonical activation authority
        id: active_lock
        continue-on-error: true
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-dependencies/decision-kernel-bundle
          EV4_DECISION_KERNEL_ACTIVATION_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-dependencies/decision-kernel-activation
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider -q
          tests/test_architect_pcvp_dormant_producer.py::test_resources_are_exactly_pinned_and_edge_activation_is_bounded
          tests/test_architect_pcvp_dormant_producer.py::test_exact_decision_kernel_activation_authority_is_pinned_and_bounded
          tests/test_architect_pcvp_dormant_producer.py::test_supported_surface_exposes_no_authoritative_raw_fact_minting_api
          tests/test_architect_pcvp_dormant_producer.py::test_runtime_authority_manifest_and_export_schema_include_active_pcvp_surface
          tests/test_architect_pcvp_dormant_producer.py::test_exporter_uses_private_pcvp_builder_without_env_or_public_override

      - name: Validate real Runtime attachment behavior
        id: runtime_attachment
        continue-on-error: true
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-dependencies/decision-kernel-bundle
          EV4_DECISION_KERNEL_ACTIVATION_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-dependencies/decision-kernel-activation
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider -q
          tests/test_architect_pcvp_dormant_producer.py::test_runtime_revalidates_payload_before_active_pcvp_attachment
          tests/test_architect_pcvp_dormant_producer.py::test_synthetic_runtime_export_emits_valid_red_carrier_without_handoff_upgrade
          tests/test_architect_pcvp_dormant_producer.py::test_live_runtime_export_emits_yellow_carrier_when_existing_handoff_allows
          tests/test_architect_pcvp_dormant_producer.py::test_copied_reconstructed_and_caller_augmented_payloads_remain_non_authorizing

      - name: Validate PCVP semantic fail-closed matrix
        id: semantic_matrix
        continue-on-error: true
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-dependencies/decision-kernel-bundle
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider -q
          tests/test_architect_pcvp_dormant_producer.py::test_private_carrier_is_deterministic_and_canonically_valid
          tests/test_architect_pcvp_dormant_producer.py::test_complete_cross_record_and_semantic_mutation_matrix
          tests/test_architect_pcvp_dormant_producer.py::test_valid_multi_claim_dependency_chain_is_accepted
          tests/test_architect_pcvp_dormant_producer.py::test_all_canonical_fixtures_match_pinned_declared_layers
          tests/test_pcvp_canonical_bytes.py

      - name: Enforce focused PCVP validation layers
        if: always()
        env:
          ACTIVE_LOCK: ${{ steps.active_lock.outcome }}
          RUNTIME_ATTACHMENT: ${{ steps.runtime_attachment.outcome }}
          SEMANTIC_MATRIX: ${{ steps.semantic_matrix.outcome }}
        run: |
          set -euo pipefail
          test "$ACTIVE_LOCK" = success
          test "$RUNTIME_ATTACHMENT" = success
          test "$SEMANTIC_MATRIX" = success

      - name: Recheck Project Gate exporter and finalization authority
        run: >-
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider -q
          tests/test_architect_project_gate_exporter.py
          tests/test_architect_project_gate_finalization_api.py

      - name: Validate Runtime Authority Manifest
        run: python scripts/check-architect-runtime-authority-manifest.py

      - name: Run complete Architect repository suite
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider -q

      - name: Assert Decision Kernel checkouts remain exact and clean
        shell: bash
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-dependencies/decision-kernel-bundle
          EV4_DECISION_KERNEL_ACTIVATION_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-dependencies/decision-kernel-activation
        run: |
          set -euo pipefail
          test "$(git -C "$EV4_DECISION_KERNEL_CHECKOUT" rev-parse HEAD)" = "069a50fa243b01fa578a7c1bcb8864d9e796d34b"
          test "$(git -C "$EV4_DECISION_KERNEL_ACTIVATION_CHECKOUT" rev-parse HEAD)" = "ad0e7235929d7f6d847724f6b4d1a6a3c57453db"
          test -z "$(git -C "$EV4_DECISION_KERNEL_CHECKOUT" status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C "$EV4_DECISION_KERNEL_ACTIVATION_CHECKOUT" status --porcelain=v1 --untracked-files=all)"

      - name: Check bounded patch whitespace
        run: git diff --check

  consumers:
    name: Exact live-head Project Gate and CE acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Architect pull request head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact Architect pull request head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Assert clean Architect checkout
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Resolve exact current consumer heads
        id: consumer_heads
        shell: bash
        env:
          PROJECT_GATE_REMOTE: https://github.com/rezahh107/EV4-Project-Gate.git
          CE_REMOTE: https://github.com/rezahh107/EV4-Constructability-Engineer-Repo.git
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          resolve_head() {
            local remote="$1"
            local output sha ref extra
            local -a rows=()
            output="$(git ls-remote --exit-code "$remote" refs/heads/main)"
            mapfile -t rows <<<"$output"
            test "${#rows[@]}" -eq 1
            read -r sha ref extra <<<"${rows[0]}"
            test -z "${extra:-}"
            test "$ref" = "refs/heads/main"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            printf '%s\n' "$sha"
          }

          project_gate_head="$(resolve_head "$PROJECT_GATE_REMOTE")"
          ce_head="$(resolve_head "$CE_REMOTE")"

          echo "EV4_PROJECT_GATE_HEAD_SHA=$project_gate_head" >> "$GITHUB_ENV"
          echo "EV4_CE_HEAD_SHA=$ce_head" >> "$GITHUB_ENV"
          echo "project_gate_sha=$project_gate_head" >> "$GITHUB_OUTPUT"
          echo "ce_sha=$ce_head" >> "$GITHUB_OUTPUT"
          echo "project_gate_head_start=$project_gate_head"
          echo "ce_head_start=$ce_head"

      - name: Checkout exact read-only consumer and bundle heads
        shell: bash
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/decision-kernel
          EV4_PROJECT_GATE_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/project-gate
          EV4_CE_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/constructability-engineer
          PROJECT_GATE_REMOTE: https://github.com/rezahh107/EV4-Project-Gate.git
          CE_REMOTE: https://github.com/rezahh107/EV4-Constructability-Engineer-Repo.git
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          checkout_exact() {
            local target="$1"; local repository="$2"; local expected_sha="$3"
            mkdir -p "$(dirname "$target")"
            git init -q "$target"
            git -C "$target" remote add origin "$repository"
            git -C "$target" -c protocol.version=2 fetch --depth=1 --no-tags origin "$expected_sha"
            git -C "$target" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$target" rev-parse HEAD)" = "$expected_sha"
            if git -C "$target" symbolic-ref -q HEAD >/dev/null; then
              echo "checkout is not detached: $target" >&2
              exit 1
            fi
            test -z "$(git -C "$target" status --porcelain=v1 --untracked-files=all)"
          }
          checkout_exact "$EV4_DECISION_KERNEL_CHECKOUT" "https://github.com/rezahh107/EV4-Decision-Kernel.git" "069a50fa243b01fa578a7c1bcb8864d9e796d34b"
          checkout_exact "$EV4_PROJECT_GATE_CHECKOUT" "$PROJECT_GATE_REMOTE" "$EV4_PROJECT_GATE_HEAD_SHA"
          checkout_exact "$EV4_CE_CHECKOUT" "$CE_REMOTE" "$EV4_CE_HEAD_SHA"

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Install pinned Decision Kernel execution dependencies
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/decision-kernel
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix "$EV4_DECISION_KERNEL_CHECKOUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install "jsonschema>=4.22.0" "pytest>=8.0.0" "PyYAML>=6.0.0"

      - name: Validate exact current Project Gate against actual Runtime emission
        id: project_gate
        continue-on-error: true
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/decision-kernel
          EV4_PROJECT_GATE_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/project-gate
          EV4_CE_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/constructability-engineer
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider -q
          tests/test_architect_pcvp_dormant_producer.py::test_exact_current_project_gate_accepts_actual_runtime_emission_losslessly

      - name: Validate exact current CE against actual Runtime emission
        id: ce
        continue-on-error: true
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/decision-kernel
          EV4_PROJECT_GATE_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/project-gate
          EV4_CE_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/constructability-engineer
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider -q
          tests/test_architect_pcvp_dormant_producer.py::test_exact_current_ce_accepts_actual_runtime_emission_without_upgrade

      - name: Enforce exact consumer acceptance
        if: always()
        env:
          PROJECT_GATE: ${{ steps.project_gate.outcome }}
          CE: ${{ steps.ce.outcome }}
        run: |
          set -euo pipefail
          test "$PROJECT_GATE" = success
          test "$CE" = success

      - name: Assert exact consumer heads remain clean
        shell: bash
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/decision-kernel
          EV4_PROJECT_GATE_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/project-gate
          EV4_CE_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/constructability-engineer
        run: |
          set -euo pipefail
          test "$(git -C "$EV4_DECISION_KERNEL_CHECKOUT" rev-parse HEAD)" = "069a50fa243b01fa578a7c1bcb8864d9e796d34b"
          test "$(git -C "$EV4_PROJECT_GATE_CHECKOUT" rev-parse HEAD)" = "$EV4_PROJECT_GATE_HEAD_SHA"
          test "$(git -C "$EV4_CE_CHECKOUT" rev-parse HEAD)" = "$EV4_CE_HEAD_SHA"
          test -z "$(git -C "$EV4_DECISION_KERNEL_CHECKOUT" status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C "$EV4_PROJECT_GATE_CHECKOUT" status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C "$EV4_CE_CHECKOUT" status --porcelain=v1 --untracked-files=all)"

      - name: Re-resolve consumer heads and require stability
        id: consumer_heads_final
        shell: bash
        env:
          PROJECT_GATE_REMOTE: https://github.com/rezahh107/EV4-Project-Gate.git
          CE_REMOTE: https://github.com/rezahh107/EV4-Constructability-Engineer-Repo.git
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          resolve_head() {
            local remote="$1"
            local output sha ref extra
            local -a rows=()
            output="$(git ls-remote --exit-code "$remote" refs/heads/main)"
            mapfile -t rows <<<"$output"
            test "${#rows[@]}" -eq 1
            read -r sha ref extra <<<"${rows[0]}"
            test -z "${extra:-}"
            test "$ref" = "refs/heads/main"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            printf '%s\n' "$sha"
          }

          project_gate_head_final="$(resolve_head "$PROJECT_GATE_REMOTE")"
          ce_head_final="$(resolve_head "$CE_REMOTE")"

          echo "project_gate_head_start=$EV4_PROJECT_GATE_HEAD_SHA"
          echo "project_gate_head_end=$project_gate_head_final"
          echo "ce_head_start=$EV4_CE_HEAD_SHA"
          echo "ce_head_end=$ce_head_final"
          echo "project_gate_sha=$project_gate_head_final" >> "$GITHUB_OUTPUT"
          echo "ce_sha=$ce_head_final" >> "$GITHUB_OUTPUT"

          test "$project_gate_head_final" = "$EV4_PROJECT_GATE_HEAD_SHA"
          test "$ce_head_final" = "$EV4_CE_HEAD_SHA"

          {
            echo "### Exact current consumer identities"
            echo "- Project Gate start: \`$EV4_PROJECT_GATE_HEAD_SHA\`"
            echo "- Project Gate end: \`$project_gate_head_final\`"
            echo "- CE start: \`$EV4_CE_HEAD_SHA\`"
            echo "- CE end: \`$ce_head_final\`"
          } >> "$GITHUB_STEP_SUMMARY"
