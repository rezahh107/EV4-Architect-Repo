name: Validate PCVP dormant Architect producer

on:
  pull_request:
    paths:
      - "contracts/pcvp/**"
      - "contracts/project-gate/producer-gate-export.v1.schema.json"
      - "manifests/architect-runtime-authority-manifest.v1.json"
      - "scripts/architect_pcvp_producer.py"
      - "scripts/architect_project_gate_exporter/contracts.py"
      - "scripts/architect_runtime_payload_authority.py"
      - "tests/test_architect_pcvp_dormant_producer.py"
      - "tests/test_architect_project_gate_exporter.py"
      - "tests/test_architect_project_gate_finalization_api.py"
      - ".github/workflows/validate-pcvp-dormant-producer.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Exact-head Runtime authority and pinned PCVP parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EV4_DECISION_KERNEL_CHECKOUT: ${{ github.workspace }}/dependencies/decision-kernel
      EV4_PROJECT_GATE_CHECKOUT: ${{ github.workspace }}/dependencies/project-gate
      EV4_CE_CHECKOUT: ${{ github.workspace }}/dependencies/constructability-engineer
    steps:
      - name: Checkout exact Architect pull request head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact clean Architect checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Checkout exact Decision Kernel reference
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rezahh107/EV4-Decision-Kernel
          ref: 069a50fa243b01fa578a7c1bcb8864d9e796d34b
          path: dependencies/decision-kernel
          persist-credentials: false

      - name: Assert exact clean Decision Kernel checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C dependencies/decision-kernel rev-parse HEAD)" = "069a50fa243b01fa578a7c1bcb8864d9e796d34b"
          test -z "$(git -C dependencies/decision-kernel status --porcelain=v1 --untracked-files=all)"

      - name: Checkout exact Project Gate consumer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rezahh107/EV4-Project-Gate
          ref: cfa666c3237a35a32b7ff186348df7532a7e02fe
          path: dependencies/project-gate
          persist-credentials: false

      - name: Assert exact clean Project Gate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C dependencies/project-gate rev-parse HEAD)" = "cfa666c3237a35a32b7ff186348df7532a7e02fe"
          test -z "$(git -C dependencies/project-gate status --porcelain=v1 --untracked-files=all)"

      - name: Checkout exact Constructability Engineer consumer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rezahh107/EV4-Constructability-Engineer-Repo
          ref: 9b0e75cdbda2f3fe99f473ae77336e1601f6daa6
          path: dependencies/constructability-engineer
          persist-credentials: false

      - name: Assert exact clean Constructability Engineer checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C dependencies/constructability-engineer rev-parse HEAD)" = "9b0e75cdbda2f3fe99f473ae77336e1601f6daa6"
          test -z "$(git -C dependencies/constructability-engineer status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install "jsonschema>=4.22.0" "pytest>=8.0.0" "PyYAML>=6.0.0"

      - name: Compile repaired authority surfaces
        run: >-
          python -m py_compile
          scripts/architect_pcvp_producer.py
          scripts/architect_project_gate_exporter/contracts.py
          tests/test_architect_pcvp_dormant_producer.py

      - name: Validate Runtime authority, semantic parity, and consumers
        run: >-
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider -q
          tests/test_architect_pcvp_dormant_producer.py

      - name: Recheck Project Gate exporter and finalization authority
        run: >-
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider -q
          tests/test_architect_project_gate_exporter.py
          tests/test_architect_project_gate_finalization_api.py

      - name: Validate Runtime Authority Manifest
        run: python scripts/check-architect-runtime-authority-manifest.py

      - name: Run complete Architect repository suite
        run: >-
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider --ignore=dependencies -q

      - name: Check bounded patch whitespace
        run: git diff --check
