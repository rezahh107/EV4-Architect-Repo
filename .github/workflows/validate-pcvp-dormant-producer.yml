name: Validate PCVP dormant Architect producer

on:
  pull_request:
    paths:
      - "contracts/pcvp/**"
      - "contracts/project-gate/producer-gate-export.v1.schema.json"
      - "manifests/architect-runtime-authority-manifest.v1.json"
      - "scripts/architect_pcvp_producer.py"
      - "scripts/architect_project_gate_exporter/contracts.py"
      - "tests/test_architect_pcvp_dormant_producer.py"
      - ".github/workflows/validate-pcvp-dormant-producer.yml"
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact pull request head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install "jsonschema>=4.22.0" "pytest>=8.0.0"
      - name: Validate hard-disabled PCVP producer
        run: >-
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider -q
          tests/test_architect_pcvp_dormant_producer.py
      - name: Recheck Project Gate exporter boundary
        run: >-
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider -q
          tests/test_architect_project_gate_exporter.py
