name: Validate PCVP active Architect producer

on:
  pull_request:
    paths:
      - "contracts/pcvp/**"
      - "contracts/project-gate/producer-gate-export.v1.schema.json"
      - "manifests/architect-runtime-authority-manifest.v1.json"
      - "scripts/architect_pcvp_producer.py"
      - "scripts/architect_project_gate_exporter/contracts.py"
      - "scripts/architect_runtime_payload_authority.py"
      - "scripts/validate-pcvp-canonical-bytes.py"
      - "tests/test_architect_pcvp_dormant_producer.py"
      - "tests/test_pcvp_canonical_bytes.py"
      - "tests/test_architect_project_gate_exporter.py"
      - "tests/test_architect_project_gate_finalization_api.py"
      - ".github/workflows/validate-pcvp-dormant-producer.yml"
      - "STATUS.md"

permissions:
  contents: read

jobs:
  validate:
    name: Exact-head Runtime authority and canonical PCVP activation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Architect pull request head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact Architect pull request head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Assert clean Architect checkout
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Checkout immutable Decision Kernel bundle snapshot
        shell: bash
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-dependencies/decision-kernel-bundle
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          checkout_exact() {
            local target="$1"
            local repository="$2"
            local expected_sha="$3"
            mkdir -p "$(dirname "$target")"
            git init -q "$target"
            git -C "$target" remote add origin "$repository"
            git -C "$target" -c protocol.version=2 fetch --depth=1 --no-tags origin "$expected_sha"
            git -C "$target" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$target" rev-parse HEAD)" = "$expected_sha"
            git -C "$target" diff --exit-code -- .
            git -C "$target" diff --cached --exit-code -- .
            test -z "$(git -C "$target" status --porcelain=v1 --untracked-files=all)"
            git -C "$target" remote remove origin
          }
          checkout_exact \
            "$EV4_DECISION_KERNEL_CHECKOUT" \
            "https://github.com/rezahh107/EV4-Decision-Kernel.git" \
            "069a50fa243b01fa578a7c1bcb8864d9e796d34b"

      - name: Checkout exact Decision Kernel activation authority
        shell: bash
        env:
          EV4_DECISION_KERNEL_ACTIVATION_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-dependencies/decision-kernel-activation
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          checkout_exact() {
            local target="$1"
            local repository="$2"
            local expected_sha="$3"
            mkdir -p "$(dirname "$target")"
            git init -q "$target"
            git -C "$target" remote add origin "$repository"
            git -C "$target" -c protocol.version=2 fetch --depth=1 --no-tags origin "$expected_sha"
            git -C "$target" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$target" rev-parse HEAD)" = "$expected_sha"
            git -C "$target" diff --exit-code -- .
            git -C "$target" diff --cached --exit-code -- .
            test -z "$(git -C "$target" status --porcelain=v1 --untracked-files=all)"
            git -C "$target" remote remove origin
          }
          checkout_exact \
            "$EV4_DECISION_KERNEL_ACTIVATION_CHECKOUT" \
            "https://github.com/rezahh107/EV4-Decision-Kernel.git" \
            "ad0e7235929d7f6d847724f6b4d1a6a3c57453db"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install "jsonschema>=4.22.0" "pytest>=8.0.0" "PyYAML>=6.0.0"

      - name: Compile active authority surfaces
        run: >-
          python -m py_compile
          scripts/architect_pcvp_producer.py
          scripts/architect_project_gate_exporter/contracts.py
          scripts/validate-pcvp-canonical-bytes.py
          tests/test_architect_pcvp_dormant_producer.py
          tests/test_pcvp_canonical_bytes.py

      - name: Validate immutable canonical PCVP bytes
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-dependencies/decision-kernel-bundle
        run: python scripts/validate-pcvp-canonical-bytes.py

      - name: Validate exact activation authority and active Runtime boundary
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-dependencies/decision-kernel-bundle
          EV4_DECISION_KERNEL_ACTIVATION_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-dependencies/decision-kernel-activation
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider -q
          tests/test_pcvp_canonical_bytes.py
          tests/test_architect_pcvp_dormant_producer.py

      - name: Recheck Project Gate exporter and finalization authority
        run: >-
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider -q
          tests/test_architect_project_gate_exporter.py
          tests/test_architect_project_gate_finalization_api.py

      - name: Validate Runtime Authority Manifest
        run: python scripts/check-architect-runtime-authority-manifest.py

      - name: Run complete Architect repository suite
        run: >-
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider -q

      - name: Assert Decision Kernel checkouts remain exact and clean
        shell: bash
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-dependencies/decision-kernel-bundle
          EV4_DECISION_KERNEL_ACTIVATION_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-dependencies/decision-kernel-activation
        run: |
          set -euo pipefail
          test "$(git -C "$EV4_DECISION_KERNEL_CHECKOUT" rev-parse HEAD)" = "069a50fa243b01fa578a7c1bcb8864d9e796d34b"
          test "$(git -C "$EV4_DECISION_KERNEL_ACTIVATION_CHECKOUT" rev-parse HEAD)" = "ad0e7235929d7f6d847724f6b4d1a6a3c57453db"
          test -z "$(git -C "$EV4_DECISION_KERNEL_CHECKOUT" status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C "$EV4_DECISION_KERNEL_ACTIVATION_CHECKOUT" status --porcelain=v1 --untracked-files=all)"

      - name: Check bounded patch whitespace
        run: git diff --check

  consumers:
    name: Exact live-head Project Gate and CE acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Architect pull request head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact Architect pull request head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Assert clean Architect checkout
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Checkout exact read-only consumer and bundle heads
        shell: bash
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/decision-kernel
          EV4_PROJECT_GATE_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/project-gate
          EV4_CE_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/constructability-engineer
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          checkout_exact() {
            local target="$1"
            local repository="$2"
            local expected_sha="$3"
            mkdir -p "$(dirname "$target")"
            git init -q "$target"
            git -C "$target" remote add origin "$repository"
            git -C "$target" -c protocol.version=2 fetch --depth=1 --no-tags origin "$expected_sha"
            git -C "$target" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$target" rev-parse HEAD)" = "$expected_sha"
            git -C "$target" diff --exit-code -- .
            git -C "$target" diff --cached --exit-code -- .
            test -z "$(git -C "$target" status --porcelain=v1 --untracked-files=all)"
          }
          checkout_exact \
            "$EV4_DECISION_KERNEL_CHECKOUT" \
            "https://github.com/rezahh107/EV4-Decision-Kernel.git" \
            "069a50fa243b01fa578a7c1bcb8864d9e796d34b"
          checkout_exact \
            "$EV4_PROJECT_GATE_CHECKOUT" \
            "https://github.com/rezahh107/EV4-Project-Gate.git" \
            "a8c743a7441dc8a06c3aa23310eed99076fc97d6"
          checkout_exact \
            "$EV4_CE_CHECKOUT" \
            "https://github.com/rezahh107/EV4-Constructability-Engineer-Repo.git" \
            "bc4a901d82fcdbdb131e30058b399508262706c5"

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Install pinned Decision Kernel execution dependencies
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/decision-kernel
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix "$EV4_DECISION_KERNEL_CHECKOUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install "jsonschema>=4.22.0" "pytest>=8.0.0" "PyYAML>=6.0.0"

      - name: Validate exact current Project Gate and CE against actual Runtime emission
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/decision-kernel
          EV4_PROJECT_GATE_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/project-gate
          EV4_CE_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/constructability-engineer
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -p no:cacheprovider -q
          tests/test_architect_pcvp_dormant_producer.py::test_exact_current_project_gate_accepts_actual_runtime_emission_losslessly
          tests/test_architect_pcvp_dormant_producer.py::test_exact_current_ce_accepts_actual_runtime_emission_without_upgrade

      - name: Assert exact consumer heads remain clean
        shell: bash
        env:
          EV4_DECISION_KERNEL_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/decision-kernel
          EV4_PROJECT_GATE_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/project-gate
          EV4_CE_CHECKOUT: ${{ runner.temp }}/ev4-pcvp-consumers/constructability-engineer
        run: |
          set -euo pipefail
          test "$(git -C "$EV4_DECISION_KERNEL_CHECKOUT" rev-parse HEAD)" = "069a50fa243b01fa578a7c1bcb8864d9e796d34b"
          test "$(git -C "$EV4_PROJECT_GATE_CHECKOUT" rev-parse HEAD)" = "a8c743a7441dc8a06c3aa23310eed99076fc97d6"
          test "$(git -C "$EV4_CE_CHECKOUT" rev-parse HEAD)" = "bc4a901d82fcdbdb131e30058b399508262706c5"
          test -z "$(git -C "$EV4_DECISION_KERNEL_CHECKOUT" status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C "$EV4_PROJECT_GATE_CHECKOUT" status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C "$EV4_CE_CHECKOUT" status --porcelain=v1 --untracked-files=all)"
